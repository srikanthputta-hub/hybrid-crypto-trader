name: Refresh dashboard data

# Runs one bot cycle on a schedule and pushes a fresh web/data.json so the
# Cloudflare-hosted dashboard reflects real activity instead of a static
# snapshot. See README.md "Dashboard" section for the manual equivalent of
# what this automates.
#
# config/config.yaml has mode: paper, so this job runs the PAPER broker: no order
# ever reaches an exchange. (An earlier version of this comment described a live
# Binance-testnet dress rehearsal; that is no longer what this job does.)
#
# LIVE_TRADING_CONFIRM is deliberately NOT set here (removed for issue #99). It is
# read only when mode is "live" (src/bot.py build_components), so a paper run never
# needs it -- and without it, a `mode: live` flip in config.yaml would make this job
# fail with LiveTradingDisabled instead of trading: mode: paper is no longer the only
# switch protecting this job. tests/test_paper_isolation.py fails if any workflow
# sets it again.
#
# State (logs/) is intentionally gitignored (see .gitignore) — it's runtime
# data, not something this repo persists in git history. To carry portfolio
# state (cash, open positions, cooldowns) between scheduled runs anyway, this
# workflow round-trips logs/ through actions/cache instead of committing it.
# That cache can be evicted (GitHub drops caches unused for 7 days, or past
# the repo's 10GB cap) — if that happens, the bot silently starts over from
# starting_cash_usd with no open positions, which is a state reset, not a
# failure, and (paper mode) never a real-money issue.
#
# `schedule:` is disabled as of 2026-09-29: scripts/run_live.py now runs
# continuously as a systemd service on an always-on Oracle Cloud VM (see
# deploy/README.md), cycling the paper-mode bot and pushing web/data.json
# after every cycle with near-zero gaps. Running this workflow's own
# schedule at the same time would mean two independent processes racing to
# push web/data.json (this one against its own cached paper state, the VM
# against the real paper portfolio) — kept disabled to avoid that. workflow_dispatch
# still works for an occasional manual on-demand run/dress-rehearsal.

on:
  # schedule:
  #   - cron: "*/5 * * * *" # disabled 2026-09-29 -- see note above; re-enable only if the VM is ever retired
  workflow_dispatch: {} # manual "Run workflow" button for on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false # never abandon a cycle mid-run; let it finish and let the next tick wait

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: logs
          key: bot-logs-${{ github.run_id }}
          restore-keys: |
            bot-logs-

      - name: Run one bot cycle (paper)
        # No EXCHANGE_API_KEY/EXCHANGE_API_SECRET either (removed, issue #99 review S2): the paper
        # bot only reads public market data (OHLCV); no private endpoint is ever called in paper
        # mode, so the job does not need exchange credentials at all.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.bot --once
        # No ANTHROPIC_API_KEY secret is passed: the Claude advisor step
        # (src/claude_advisor.py) fails *closed* by design when the key is
        # missing — it vetoes rather than erroring, so this still runs clean.
        # Add an ANTHROPIC_API_KEY repo secret and pass it here as an env var
        # if you want the advisor's real second opinion in these runs.
        #
        # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are optional (src/notifier.py):
        # a signal/fill/close message is sent only if both are set as repo
        # secrets; with either missing, this step runs exactly the same,
        # just without notifications.

      - name: Export dashboard data
        run: python scripts/export_dashboard_data.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs
          key: bot-logs-${{ github.run_id }}

      - name: Commit and push refreshed dashboard data
        run: |
          # Do NOT add [skip ci] to this commit message. This workflow only
          # triggers on schedule/workflow_dispatch (see `on:` above), never on
          # push, so [skip ci] buys nothing here -- but Cloudflare Workers
          # Build also scans commit messages for that tag and skips deploying
          # any commit that carries it. With it, every single automated
          # data.json refresh was silently never reaching production; the
          # live site only ever updated at PR-merge commits. Found and fixed
          # 2026-09-27 after live signal charts kept showing stale/empty data
          # despite web/data.json on `main` being correct.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data"
          git push
