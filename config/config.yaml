# Hybrid crypto trading bot configuration.
# Start in "paper" mode and leave it there until you have watched it trade
# for a while and are comfortable with what it does.

mode: paper              # "paper" or "live" — see .env.example for the second safety switch live mode needs

exchange:
  id: kraken               # any ccxt exchange id: binance, kraken, coinbase, bybit, ...
                            # (switched from Binance: its endpoints return HTTP 451 "restricted
                            # location" from GitHub Actions' IP range, blocking market data)
  testnet: false           # Kraken has no ccxt-supported sandbox mode (unlike Binance);
                            # this is real Kraken market data (reads only, in paper mode)

market:
  symbols:                 # whitelist — the bot will only ever look at / trade these.
                            # Verified empirically against Kraken's real ccxt market list (a
                            # 2026-09-27 workflow_dispatch run of refresh-dashboard.yml -- see
                            # job 108597402474's logs, then 108598510828, then 108604148650,
                            # then 108605953783): four rounds of candidates each had some
                            # symbols raise ccxt.base.errors.BadSymbol -- Kraken has no /USDT
                            # market for them via ccxt, despite being real, liquid coins there
                            # against USD. Kraken's API is network-blocked from this dev
                            # sandbox, so this list was built by testing against the real
                            # exchange via GitHub Actions rather than by static lookup.
                            # Confirmed dead on Kraken/ccxt so far (do not re-add without
                            # re-testing): DASH, NEAR, SUI, ZEC, TAO, PEPE, WIF, HYPE, TRX, ETC,
                            # XLM, UNI, FIL, APT, ICP (dropped 2026-09-27 -- no Kraken ccxt
                            # /USDT market).
                            # XMR, XAUT, and FARTCOIN were removed 2026-09-27 for a different
                            # reason -- not a Kraken/ccxt problem, they worked fine there -- the
                            # user couldn't find them on Revolut X (the exchange they actually
                            # trade these signals on manually), so they're not useful watchlist
                            # entries for this user even though the bot itself could still scan
                            # them. Settled at 16 symbols rather than chasing further
                            # replacements. Re-add either if that changes.
                            # If a symbol below ever starts failing, that's Kraken's own
                            # listings changing, not a bug here (a failing symbol just gets
                            # logged and skipped per-cycle, never blocks the rest -- see
                            # run_cycle's per-symbol try/except in src/bot.py).
    - "BTC/USDT"
    - "ETH/USDT"
    - "XRP/USDT"
    - "SOL/USDT"
    - "ADA/USDT"
    - "DOGE/USDT"
    - "AVAX/USDT"
    - "LINK/USDT"
    - "BNB/USDT"
    - "LTC/USDT"
    - "DOT/USDT"
    - "ATOM/USDT"
    - "ALGO/USDT"
    - "BCH/USDT"
    - "XTZ/USDT"
    - "SHIB/USDT"
  timeframe: "1h"           # ccxt timeframe string: 1m, 5m, 15m, 1h, 4h, 1d
  history_bars: 200         # bars of OHLCV history fetched each cycle for indicators/scanner

# Phase 1b of docs/system-redesign-2026-10.md (§4.2): the symbol-universe
# source of truth. Only `mode` does anything right now -- src/universe.py's
# refresh() in `static` mode just wraps market.symbols above verbatim, making
# zero exchange calls. The other keys below are documented here so the shape
# is visible and ready for Phase 1e's separately-gated "discover" mode
# (full Kraken USD/USDT universe, point-in-time liquidity ranking) -- none of
# them are read yet, and `mode: discover` currently raises NotImplementedError
# rather than doing anything undefined.
universe:
  mode: static              # "static" = exactly today's behavior (market.symbols) | "discover" (not implemented yet)
  quotes: ["USD", "USDT"]   # NOT YET USED (discover mode only)
  prefer_quote: "USD"       # one pair per base asset when discovering; NOT YET USED
  min_median_quote_volume_usd: 1000000   # 30-day MEDIAN daily quote volume floor; NOT YET USED
  exit_volume_ratio: 0.5    # hysteresis so membership doesn't churn at the floor; NOT YET USED
  min_listing_age_days: 60  # NOT YET USED
  max_symbols: 150          # NOT YET USED
  include_symbols: []       # pins beyond discovery; NOT YET USED
  exclude_bases: []         # e.g. stablecoins/wrapped assets to always drop in discover mode; NOT YET USED
  exclude_symbols: {}       # "SYMBOL": "reason + date" -- human-maintained structural exclusions; NOT YET USED
  quarantine_after_failures: 3   # consecutive fetch failures -> temporary exclusion; NOT YET USED
  refresh_utc: "00:15"      # NOT YET USED

# EMA/RSI/ATR settings, shared by the scanner, the pullback/trend detectors, and the trade planner.
indicators:
  fast_ema: 12
  slow_ema: 26
  rsi_period: 14

# Pipeline stage 1 — "scans the market 24/7 for potential setups."
# Each detector's own thresholds; see src/scanner.py for exactly how each is used.
scanner:
  breakout_lookback: 20
  breakout_volume_multiplier: 1.5
  pullback_bounce_lookback: 5
  pullback_tolerance_pct: 0.004
  momentum_lookback: 5
  momentum_return_threshold: 0.03
  trend_confirm_bars: 10
  consolidation_bars: 8
  consolidation_max_range_atr: 2.5
  reversal_swing_lookback: 10
  reversal_rsi_oversold: 30
  reversal_rsi_overbought: 70
  adx_trend_threshold: 25   # Wilder ADX convention: >=25 confirms a real/sustainable trend (used as a
                            # strength bonus, not a hard gate — see src/scanner.py)

# Pipeline stage 2 — "filters noise and generates high-probability trade signals."
signal_engine:
  min_strength: 0.5          # drop any scanner candidate weaker than this
  confluence_bonus: 0.08     # score boost per additional pattern agreeing on direction
  pattern_priority:          # tie-breaker when two candidates have equal strength
    - "BREAKOUT"
    - "TREND_CONTINUATION"
    - "MOMENTUM"
    - "PULLBACK"
    - "REVERSAL"

# Pipeline stage 2b — higher-timeframe (daily) trend confirmation gate (see
# src/htf_filter.py). Standard top-down multi-timeframe practice: the daily
# chart sets directional bias, market.timeframe (1h) only times entries
# within that bias. A bullish signal whose daily trend isn't also confirmed
# bullish (daily fast EMA > slow EMA, using indicators.fast_ema/slow_ema) is
# blocked from ever becoming a trade plan -- this never originates or
# resizes a trade, only vetoes one. Set enabled: false to disable entirely.
htf_filter:
  enabled: true

# Pipeline stage 3 — "creates the trade plan with entry, target, stop loss, and invalidation."
trade_planner:
  entry_buffer_atr_mult: 0.1     # how wide the entry zone is, in ATRs, around the pattern's level
  stop_atr_mult: 1.5             # stop loss = entry zone low - this many ATRs. Widened from 1.0 after the
                                 # 2026-09-29 losing streak: backed out the actual ATR used for 3 of that day's
                                 # stop-outs and found the real move-candle's range was 1.6-2.4x the trailing
                                 # ATR(14) -- a 1.0x stop is sized for calm conditions and gets blown through the
                                 # moment volatility genuinely spikes, a known static-stop failure mode during a
                                 # regime shift. Backtested 1.0 vs 1.5 vs 2.0 on strategy_pack_run/'s real-
                                 # pipeline harness (kraken_T3_taker), both datasets: on the 11-year set (746/
                                 # 562/501 trades -- the statistically strong one) 1.5 beats 1.0 on EVERY metric
                                 # (avg R 0.39->0.52, CI [0.24,0.54]->[0.36,0.68] fully positive, return 311%->
                                 # 388%, maxDD -33.6%->-29.2%, Sharpe 0.92->1.00, still 5/5 gates); on the 2-year
                                 # set, 1.5 improves return/maxDD/Sharpe (11.6%->22.5%, -32.1%->-24.1%, 0.39->
                                 # 0.68) with a noisier (not clearly worse) avg-R confidence interval. 2.0
                                 # overshoots and is clearly worse than 1.5 on both datasets -- this isn't
                                 # "wider is always better," 1.5 is the evidenced point, not a guess. Position
                                 # sizing is risk_amount/stop_distance, so this doesn't increase $ risk per
                                 # trade -- it just needs a bigger adverse move to realize the same loss.
  invalidation_atr_mult: 0.5     # invalidation = stop loss - this many further ATRs
  min_risk_reward: 2.0           # take-profit target is sized to hit at least this R:R
  adx_trend_threshold: 25        # regime filter: Wilder ADX >= this confirms a real trend (matches scanner.py)
  trend_stop_atr_bonus: 0.3      # widen (never tighten) the stop by this many extra ATRs when ADX confirms a trend, to avoid shaking out of trend-noise pullbacks

# Pipeline stage 4 — "checks position size, exposure, drawdown, volatility and max loss."
risk:
  starting_cash_usd: 10000       # paper-trading starting balance
  max_position_pct: 0.10         # flat ceiling: never put more than 10% of equity in one position
  max_total_exposure_pct: 0.40   # never have more than 40% of equity committed across all open positions at once
  max_loss_per_trade_pct: 0.01   # size each position so a stop-out never loses more than 1% of equity
  max_daily_loss_pct: 0.05       # halt all new trades for the day if realized+unrealized loss exceeds 5%
  max_volatility_pct: 0.08       # skip new entries when ATR/price exceeds 8% (too chaotic to size risk on)
  volatility_scale_floor: 0.5    # volatility-based sizing (research: scaling size inversely to ATR/price cuts
                                 # drawdowns vs. fixed-fractional sizing). The per-trade risk budget tapers
                                 # linearly from 100% at ATR/price <= max_volatility_pct/2 down to this
                                 # fraction as ATR/price approaches the hard max_volatility_pct cap. Must be
                                 # in [0, 1] -- it can only ever shrink a position, never grow one.
                                 # NOTE: src/bot.py does not yet pass this key to RiskEngine; the engine's
                                 # built-in default (0.5) is what's in effect until it does.
  min_risk_reward: 1.5           # reject any trade plan whose risk/reward is below this, even if the risk engine would otherwise size it
  cooldown_minutes: 60           # minimum time between new plans on the same symbol
  max_new_entries_per_window: 5  # GLOBAL new-entry rate cap, across ALL symbols combined (cooldown_minutes above
  new_entry_window_minutes: 120  # is per-symbol only): at most this many new plans accepted in any rolling window
                                 # of this many minutes; anything beyond is rejected (never resized). Added after
                                 # 2026-09-29, when 11 different symbols were entered between 11:10-12:47 UTC on one
                                 # market-wide pullback (one correlated bet) and 9 stopped out together. 120 min
                                 # spans that whole ~100-min burst. Backtested on strategy_pack_run/'s daily-bar
                                 # harness (kraken_T3_taker) at several N: 3/120 cut 2y return 16.5%->-1.1% and
                                 # dropped 2y gates from 3/5 to 1/5 (same-day multi-coin entries were on average
                                 # the strategy's BETTER trades on daily bars there) -- too aggressive. 5/120 costs
                                 # less: 2y return 16.5%->11.6%, gates roughly flat at 4/5 vs the uncapped
                                 # original's 3/5 (the extra pass is the placebo gate moving from the 90th to the
                                 # 91st percentile -- right at the threshold, noise-level, not a real improvement);
                                 # 11y still passes all 5 gates, return 358%->311%.
                                 # IMPORTANT CAVEAT: N=5 barely touches the actual DOLLAR exposure of a 09-29-style
                                 # burst. max_position_pct=0.10 and max_total_exposure_pct=0.40 already cap full-
                                 # size concurrent positions at 4, so a cap of 5 entries never actually limits
                                 # full-size correlated exposure -- the existing exposure cap does that first.
                                 # Replaying the real 09-29 entries, N=5 lets 5 of the 11 burst entries through;
                                 # everything past the 4th was already a tiny ("dust") fill on scraps of exposure
                                 # room. Treat this cap as a guard against an even larger, more extreme burst
                                 # (e.g. 15-20+ simultaneous signals), NOT as the fix for 09-29's actual loss --
                                 # that would need a lower max_total_exposure_pct or (more directly) a minimum
                                 # order/notional size, neither of which exists yet. Daily bars also can't test
                                 # the live 1h/5-minute cadence this guards against, so this remains a risk-
                                 # appetite choice informed by, not proven by, the backtest -- revisit if hourly
                                 # backtest data ever becomes available. Must be an integer >= 1 / a number > 0.
  kill_switch_file: "KILL_SWITCH"  # if this file exists in the project root, refuse all new entries

# Pipeline stage 4b — Claude's second opinion. Can only veto a plan the pipeline
# above already built; see src/claude_advisor.py.
advisor:
  enabled: false              # disabled 2026-09-27: no ANTHROPIC_API_KEY secret is configured in
                               # refresh-dashboard.yml's CI env, so with fail_mode "closed" every
                               # single qualifying trade plan was being silently vetoed on every
                               # cycle (missing key -> _fallback -> VETO) -- the scanner was finding
                               # real setups (e.g. bullish PULLBACK on BTC/ETH/ADA/DOGE/BCH) but zero
                               # ever reached execution. Re-enable once ANTHROPIC_API_KEY is added as
                               # a repo secret and wired into that workflow's env block.
  model: "claude-sonnet-4-5"  # any current Claude model id your API key can access
  fail_mode: "closed"         # "closed" = skip the trade if the advisor errors/times out; "open" = proceed without review
  timeout_seconds: 20

# Pipeline stage 5 — the 24/7 monitor (src/monitor.py) checks every PENDING/OPEN
# plan against current price every cycle; there's no separate config for it,
# since every threshold it checks already lives on the trade plan itself.
loop:
  poll_interval_seconds: 300   # how often the main loop runs a full cycle in live/paper continuous mode

logging:
  audit_log_path: "logs/audit_log.jsonl"
  trade_log_path: "logs/trades.csv"
  trade_plan_current_path: "logs/trade_plans_current.json"
  trade_plan_history_path: "logs/trade_plans_history.jsonl"
  # Written by src/market_data.py (MarketDataCache) after every refresh pass:
  # current price (last closed bar's close) + recent candles per symbol.
  # scripts/export_dashboard_data.py reads this instead of making its own
  # independent exchange calls -- see docs/system-redesign-2026-10.md §4.1/§4.3.
  market_snapshot_path: "logs/market_snapshot.json"
  # Only used by scripts/run_live.py (the 24/7 VM loop), once a day: rows
  # older than this many days are pruned from audit_log_path and
  # trade_plan_history_path, so a long-running host's disk doesn't fill up
  # (see deploy/README.md). trade_log_path (trades.csv) is never pruned --
  # that's the actual financial record. Set to 0 or a negative number to
  # disable pruning entirely (keep full history).
  retention_days: 30
